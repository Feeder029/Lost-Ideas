<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='components/auth/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}">
</head>
<body>
    <div class="auth-container" id="auth-container">
        <div class="auth-form-card">
            <input type="radio" name="authview" id="view-login" class="auth-view-radio" checked>
            <input type="radio" name="authview" id="view-signup" class="auth-view-radio">

            <div class="auth-switcher">
                <label for="view-login">Log In</label>
                <label for="view-signup">Sign Up</label>
            </div>

            <div class="auth-panel" id="login-panel">
                <h2 class="modal-title">Welcome back!</h2>
                <form class="idea-form" onsubmit="return false;">
                    <label class="form-group">
                        <span class="form-label">Email</span>
                        <input type="email" placeholder="you@example.com" required>
                    </label>
                    <label class="form-group">
                        <span class="form-label">Password</span>
                        <input type="password" placeholder="••••••••" required>
                    </label>
                    <button type="submit" class="adopt-stamp auth-submit-btn">🔑 Log In</button>
                </form>
                <p class="auth-switch-note">New to the archive? <label for="view-signup">Sign up</label></p>
            </div>
        
            <div class="auth-panel" id="signup-panel">
                <h2 class="modal-title">File your first idea!</h2>
                <form class="idea-form" onsubmit="return false;">
                    <label class="form-group">
                        <span class="form-label">Nickname</span>
                        <input type="text" placeholder="e.g. Hatdog123" required>
                    </label>
                    <label class="form-group">
                        <span class="form-label">Email</span>
                        <input type="email" placeholder="you@example.com" required>
                    </label>
                    <label class="form-group">
                        <span class="form-label">Password</span>
                        <input type="password" placeholder="••••••••" required>
                    </label>
                    <button type="submit" class="adopt-stamp auth-submit-btn">📂 Create Account</button>
                </form>
                <p class="auth-switch-note">Already filed with us? <label for="view-login">Log in</label></p>
            </div>
        </div>
    </div>
</body>
</html>
