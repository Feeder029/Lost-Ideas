<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='components/profile/profile.css') }}">
</head>
<body>
    <section class="profile-container">
        <div class="profile-card">
            <h2 class="profile-avatar">{{ get_initials(current_user.username) }}</h2>
            <h2 class="profile-name">{{ current_user.username }}</h2>
            <p class="profile-bio"></p>
        </div>
        <div class="profile-stats">

            <button class="profile-stats-row" type="button" data-target="ideas-shared">
                <h2 class="profile-stats-num" id="ideas-shared">
                    {{ stats.ideas_shared }}
                </h2>
                <p class="stats-title">Ideas Shared</p>
            </button>

            <button class="profile-stats-row" type="button" data-target="ideas-adopted">
                <h2 class="profile-stats-num" id="ideas-adopted">
                    {{ stats.ideas_adopted }}
                </h2>
                <p class="stats-title">Ideas Adopted</p>
            </button>

            <button class="profile-stats-row" type="button" data-target="ideas-built">
                <h2 class="profile-stats-num" id="ideas-built">
                    {{ stats.ideas_built }}
                </h2>
                <p class="stats-title">Ideas Built</p>
            </button>

        </div>
        <div class="ideas-container">
            <div class="ideas-container-heading">
                <h2>Ideas shared</h2>
            </div>
            <div class="divider">&nbsp;</div>
            <div class="ideas-content">
                <div class="idea">
                    <span class="idea-category">💡</span>
                    <div class="idea-details">
                        <h2 class="idea-title">Lorem Ipsum DOlor</h2>
                        <p class="idea-posted">Posted 3 Days Ago</p>
                    </div>
                    <span class="idea-difficulty">MEDIUM</span>
                    <a href="#" class="actions">...</a>
                </div>
                <div class="idea">
                    <span class="idea-category">💡</span>
                    <div class="idea-details">
                        <h2 class="idea-title">Lorem Ipsum DOlor</h2>
                        <p class="idea-posted">Posted 3 Days Ago</p>
                    </div>
                    <span class="idea-difficulty">MEDIUM</span>
                    <a href="#" class="actions">...</a>
                </div>
            </div>
        </div>
        <div class="profile-achievements">
            <h2>Achievements</h2>
            <div class="achievements-container">
                <ul>
                    <li class="achievement">🏆Coming Soon!</li>
                </ul>
            </div>
        </div>
    </section>
    
    {% block scripts %}
        <script src="{{ url_for('static', filename='components/profile/profile.js') }}"></script>
    {% endblock %}
</body>
</html>
