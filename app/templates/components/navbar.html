{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='components/navbar/navbar.css') }}">
{% endblock %}

{% block content %}
    <nav>
        <div class="logo">
            <a href="/">💡 Lost Ideas</a>
        </div>

        <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Toggle navigation"
        >
            ☰
        </button>

        <ul class="nav-links" id="nav-links">
            <li>
                <a href="{{ url_for('paging.main', page='explore') }}" class="{% if page == 'explore' %}active{% endif %}">
                    Explore
                </a>
            </li>

            <li>
                <a href="#">Leaderboards</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>
        </ul>

        {% if current_user %}
        <div class="profile-menu">
            <button
                id="profile"
                class="profile-btn"
                type="button"
            >
                <span class="profile-icon">👤</span>
                <span class="profile-text">Account</span>
            </button>

            <div id="profile-dropdown" class="profile-dropdown">
                <a href="{{ url_for('paging.main', page='profile') }}">
                    Profile
                </a>

                <a href="/logout" id="btn-auth-logout">
                    Logout
                </a>
            </div>
        </div>
        {% else %}
        <div class="auth">
            <a href="/auth" id="btn-auth-open">Login</a>
        </div>
        {% endif %}
    </nav>

    <main id="content">
        <div id="logout-confirm-container" class="logout-confirm-container">
            <div class="logout-confirm-card">
                <h2>Logout?</h2>
                <p>Are you sure you want to logout?</p>

                <div class="logout-confirm-actions">
                    <button id="btn-logout-no" type="button">No</button>
                    <button id="btn-logout-yes" type="button">Yes, Logout</button>
                </div>
            </div>
        </div>
    </main>

    {% block scripts %}
        <script src="{{ url_for('static', filename='components/navbar/navbar.js') }}"></script>
    {% endblock %}
{% endblock %}
